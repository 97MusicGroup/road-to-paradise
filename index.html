<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0a0a0a">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Road to Paradise">
<title>ROAD TO PARADISE</title>
<style>
  :root{ --red:#ff1e1e; --black:#0a0a0a; --white:#f4f2f2; }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;touch-action:manipulation;}
  html,body{height:100%;overflow:hidden;background:var(--black);overscroll-behavior:none;position:fixed;inset:0;width:100%;}
  body{font-family:'Courier New',monospace;font-weight:bold;color:var(--white);}
  #wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;}
  canvas{image-rendering:pixelated;image-rendering:crisp-edges;max-width:100%;max-height:100%;touch-action:none;}
  .ctl{position:fixed;bottom:max(8px,env(safe-area-inset-bottom));z-index:6;display:flex;gap:7px;opacity:0.62;}
  #ctlL{left:max(8px,env(safe-area-inset-left));} #ctlR{right:max(8px,env(safe-area-inset-right));}
  .tbtn{width:50px;height:50px;border:2px solid var(--red);background:rgba(10,10,10,.55);
    color:var(--red);font-family:inherit;font-weight:bold;font-size:16px;touch-action:none;
    display:flex;flex-direction:column;align-items:center;justify-content:center;box-shadow:3px 3px 0 #000;line-height:1;}
  .tbtn small{font-size:7px;margin-top:2px;letter-spacing:0.5px;}
  .tbtn:active{background:var(--red);color:var(--black);}
  .tbtn.sp{border-color:#555;color:#777;}
  .tbtn.sp.ready{background:var(--red);border-color:var(--red);color:var(--black);animation:pulse .5s steps(2) infinite;}
  .tbtn.em{border-color:#ffd23f;color:#ffd23f;}
  @keyframes pulse{50%{background:rgba(255,30,30,.3);color:var(--red);}}
  .hideCtl{display:none!important;}
  #rotate{position:fixed;inset:0;background:var(--black);z-index:50;display:none;
    flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center;padding:30px;}
  #rotate .r{font-size:40px;color:var(--red);}
  @media (orientation:portrait){ #rotate{display:flex;} }

  #emailBox{position:fixed;inset:0;background:rgba(5,2,2,.92);z-index:40;display:none;
    flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:20px;text-align:center;}
  #emailBox.show{display:flex;}
  #emailBox input{font-family:inherit;font-size:16px;padding:12px 14px;width:min(320px,80vw);
    border:3px solid var(--red);background:#000;color:var(--white);text-align:center;
    user-select:text;-webkit-user-select:text;touch-action:manipulation;}
  #emailBox .row{display:flex;gap:10px;}
  #emailBox button{font-family:inherit;font-weight:bold;padding:11px 20px;border:3px solid var(--white);
    background:var(--red);color:#000;box-shadow:3px 3px 0 #000;}
  #emailBox .skip{background:transparent;color:#999;border-color:#444;}
  #emailBox .note{font-size:10px;color:#888;max-width:280px;}

  #shareBox{position:fixed;inset:0;background:rgba(5,2,2,.92);z-index:41;display:none;
    flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:20px;text-align:center;}
  #shareBox.show{display:flex;}
  #shareBox .row{display:flex;gap:12px;}
  #shareBox button{font-family:inherit;font-weight:bold;padding:16px 20px;border:3px solid var(--red);
    background:rgba(255,30,30,.12);color:var(--white);box-shadow:3px 3px 0 #000;font-size:13px;}
  #shareBox button small{display:block;font-size:10px;color:#999;margin-top:4px;font-weight:normal;}
  #shareBox .skip{border-color:#444;color:#999;}
</style>
</head>
<body>
<div id="wrap"><canvas id="cv" width="800" height="450"></canvas></div>

<div class="ctl hideCtl" id="ctlL">
  <div class="tbtn" data-k="left">&#9664;</div>
  <div class="tbtn" data-k="right">&#9654;</div>
  <div class="tbtn" data-k="jump">&#9650;<small>JUMP</small></div>
  <div class="tbtn" data-k="crouch">&#9660;<small>CROUCH</small></div>
</div>
<div class="ctl hideCtl" id="ctlR">
  <div class="tbtn em" data-k="dance">&#9835;<small>DANCE</small></div>
  <div class="tbtn" data-k="punch">P<small>PUNCH</small></div>
  <div class="tbtn" data-k="kick">K<small>KICK</small></div>
  <div class="tbtn sp" id="spBtn" data-k="special">S<small>SPECIAL</small></div>
</div>

<div id="rotate">
  <div class="r">&#8635;</div>
  <div>ROTATE YOUR PHONE</div>
  <div style="color:var(--red)">THE ROAD TO PARADISE PLAYS IN LANDSCAPE</div>
</div>

<div id="emailBox">
  <div style="color:var(--red);font-size:20px;letter-spacing:2px;">JOIN THE LIST</div>
  <div class="note">Get early access to future AIH drops. One email, no spam.</div>
  <input id="emailInput" type="email" placeholder="you@email.com" autocomplete="email">
  <div class="row">
    <button id="emailSubmit">SUBMIT</button>
    <button class="skip" id="emailSkip">SKIP</button>
  </div>
  <div id="emailMsg" class="note"></div>
</div>

<div id="shareBox">
  <div style="color:var(--red);font-size:18px;letter-spacing:2px;">SHARE YOUR RUN</div>
  <div class="row">
    <button id="shareStory">STORY<small>1080 x 1920</small></button>
    <button id="shareSquare">SQUARE<small>1080 x 1080</small></button>
  </div>
  <button class="skip" id="shareCancel">CANCEL</button>
</div>

function bake(grid){
  const c=document.createElement('canvas');
  c.width=grid[0].length*PX;c.height=grid.length*PX;
  const g=c.getContext('2d');
  grid.forEach((row,y)=>{[...row].forEach((ch,x)=>{
    if(ch!=='.'&&PAL[ch]){g.fillStyle=PAL[ch];g.fillRect(x*PX,y*PX,PX,PX);}
  });});
  return c;
}

];
function drawCube(x,y,s,alpha){
  ctx.save();ctx.globalAlpha=alpha;
  CUBE.forEach((row,ry)=>{[...row].forEach((ch,rx)=>{
    if(ch==='r'){ctx.fillStyle=RED;ctx.fillRect(x+rx*s,y+ry*s,s,s);}
    else if(ch==='b'){ctx.fillStyle=BLACK;ctx.fillRect(x+rx*s,y+ry*s,s,s);}
  });});
  ctx.restore();
}

let AC=null;
function ac(){if(!AC)AC=new (window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume();return AC;}
function blip(f,d,type,v){try{
  const c=ac(),o=c.createOscillator(),g=c.createGain();
  o.type=type||'square';o.frequency.value=f;
  g.gain.setValueAtTime(v||.07,c.currentTime);
  g.gain.exponentialRampToValueAtTime(.001,c.currentTime+d);
  o.connect(g);g.connect(c.destination);o.start();o.stop(c.currentTime+d);
}catch(e){}}

function spark(x,y,col,n){
  if(G.parts.length>90)return;
  for(let i=0;i<n;i++)G.parts.push({x,y,vx:(Math.random()-.5)*0.4,vy:-Math.random()*0.35,life:400,col});
}
function pop(x,y,txt,col){G.pops.push({x,y,txt,life:900,col:col||WHITE});}
function addScore(n,x,y){G.score+=n;if(x!==undefined)pop(x,y,'+'+n,GOLD);}
function updateJuice(dt){
  G.parts.forEach(p=>{p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=0.001*dt;p.life-=dt;});
  G.parts=G.parts.filter(p=>p.life>0);
  G.pops.forEach(p=>{p.y-=0.045*dt;p.life-=dt;});
  G.pops=G.pops.filter(p=>p.life>0);
}
function drawJuice(){
  G.parts.forEach(p=>{ctx.globalAlpha=p.life/400;ctx.fillStyle=p.col;
    ctx.fillRect(p.x-G.camX-2,p.y-2,4,4);});
  ctx.globalAlpha=1;
  ctx.font='bold 15px "Courier New"';ctx.textAlign='center';
  G.pops.forEach(p=>{ctx.globalAlpha=Math.min(1,p.life/500);
    ctx.fillStyle=BLACK;ctx.fillText(p.txt,p.x-G.camX+2,p.y+2);
    ctx.fillStyle=p.col;ctx.fillText(p.txt,p.x-G.camX,p.y);});
  ctx.globalAlpha=1;ctx.textAlign='left';
}

/* ================= FLOW ================= */
function startGame(){G.level=0;G.score=0;startLevel(true);}
function startLevel(fresh){
  const prev=!fresh&&P?{hp:P.hp,meter:P.meter}:null;
  P=mkDJ(G.playerChar,120,false);
  ALLY=mkDJ(1-G.playerChar,60,true);
  if(prev){P.hp=Math.min(100,prev.hp+30);P.meter=prev.meter;}
  G.camX=0;G.waveIdx=0;G.waveActive=false;
  G.enemies=[];G.parts=[];G.pops=[];G.readyFlag=P.meter>=100;
  const L=LEVELS[G.level],types=['headphones','vinyl','deck'];
  G.pickups=[0.28,0.52,0.78].map((f,i)=>({
    type:types[(G.level+i)%3], x:L.len*f, taken:false, bobSeed:Math.random()*6
  }));
  G.scene='levelIntro';G.t=0;sfx.level();
}
function spawnWave(){
  const w=LEVELS[G.level].waves[G.waveIdx];
  G.waveActive=true;
  for(let i=0;i<w.n;i++){
    const fromRight=(G.camX<120)?true:(i%2===0);
    const x=fromRight?G.camX+W-30-((i/2)|0)*44:G.camX+30+((i/2)|0)*44;
    G.enemies.push(mkGoon(Math.max(20,x),w.boss));
  }
}

/* ================= COMBAT ================= */
function attack(f,type){
  if(f.down||f.state==='crouch'||f.state==='dance')return;
  if(f.state!=='idle'&&f.state!=='walk'){f.queued=type;return;}
  f.state=type;f.stateT=0;
}
function fireSpecial(f){
  if(f.down||f.state==='crouch'||f.state==='dance')return;
  if(f.state!=='idle'&&f.state!=='walk')return;
  if(f.meter<100){
    if(!f.isAlly){sfx.noMeter();pop(f.x,FLOOR-SH-24,'CHARGE METER!',RED);}
    return;
  }
  f.meter=0;f.state='special';f.stateT=0;G.shake=16;sfx.special();
  if(!f.isAlly)G.readyFlag=false;
  spark(f.x,FLOOR-SH/2,RED,18);spark(f.x,FLOOR-SH/2,WHITE,8);
  G.enemies.forEach(e=>{
    if(!e.down&&Math.abs(e.x-f.x)<180){
      e.hp-=25;e.hitT=200;e.x+=Math.sign(e.x-f.x||1)*50;
      spark(e.x,FLOOR-SH/2,RED,8);
      if(!f.isAlly)addScore(50,e.x,FLOOR-SH-10);
      if(e.hp<=0)killGoon(e,f);
    }
  });
}
function startDance(f){
  if(f.down||f.state==='dance')return;
  if(f.state!=='idle'&&f.state!=='walk')return;
  f.state='dance';f.stateT=0;
  if(!f.isAlly)playHook(false);
}
function startCrouch(down){
  if(P.down)return;
  if(down){ if(P.state==='idle'||P.state==='walk'){P.state='crouch';P.stateT=0;} }
  else { if(P.state==='crouch')P.state='idle'; }
}
function killGoon(e,by){
  e.down=true;e.deadT=0;sfx.down();
  spark(e.x,FLOOR-SH/2,'#555',10);
  if(by&&!by.isAlly)addScore(e.boss?500:100,e.x,FLOOR-SH-26);
}
function hurtDJ(dj,dmg,from){
  if(dj.down||dj.hitT>0)return;
  dj.hp=Math.max(0,dj.hp-dmg);dj.hitT=400;
  dj.x+=Math.sign(dj.x-from.x||1)*16;
  G.shake=Math.max(G.shake,7);sfx.hurt();
  spark(dj.x,FLOOR-SH/2,RED,6);
  if(dj.hp<=0){dj.down=true;sfx.down();
    if(!dj.isAlly){G.scene='gameover';G.t=0;sfx.lose();}
  }
}
function djAttackResolve(f,dt){
  if(f.state!=='punch'&&f.state!=='kick')return;
  const m=MOVES[f.state];const prev=f.stateT;f.stateT+=dt;
  if(prev<m.active&&f.stateT>=m.active){
    let hit=false;
    G.enemies.forEach(e=>{
      if(e.down)return;
      const dx=e.x-f.x;
      if(Math.abs(dx)<=m.range+26&&Math.sign(dx||1)===f.facing){
        e.hp-=m.dmg;e.hitT=180;e.x+=f.facing*m.push;hit=true;
        f.meter=Math.min(100,f.meter+m.dmg*1.4);
        spark(e.x,FLOOR-SH*0.65,WHITE,5);
        if(!f.isAlly)addScore(m.pts,e.x,FLOOR-SH-10);
        if(e.hp<=0)killGoon(e,f);
      }
    });
    sfx[hit?m.sound:'whiff']();
  }
  if(f.stateT>=m.dur){
    f.state='idle';f.stateT=0;
    if(f.queued){const q=f.queued;f.queued=null;attack(f,q);}
  }
}

/* ================= AI ================= */
function nearestGoon(x,maxDist){
  let best=null,bd=maxDist||1e9;
  G.enemies.forEach(e=>{if(!e.down){const d=Math.abs(e.x-x);if(d<bd){bd=d;best=e;}}});
  return best;
}
function allyUpdate(f,dt){
  if(f.down)return;
  if(f.state==='dance'){f.stateT+=dt;if(f.stateT>1400)f.state='idle';return;}
  if(f.state==='punch'||f.state==='kick'){djAttackResolve(f,dt);return;}
  if(f.state==='special'){f.stateT+=dt;if(f.stateT>500)f.state='idle';return;}
  const gap=P.x-f.x;
  if(Math.abs(gap)>240){
    f.facing=Math.sign(gap);f.x+=f.facing*0.2*dt;f.state='walk';f.walk+=dt;return;
  }
  const tgt=nearestGoon(f.x,300);
  if(tgt){
    f.facing=tgt.x>f.x?1:-1;
    const d=Math.abs(tgt.x-f.x);
    if(f.meter>=100&&d<160)fireSpecial(f);
    else if(d>60){f.x+=f.facing*0.11*dt;f.state='walk';f.walk+=dt;}
    else{f.aiT-=dt;
      if(f.aiT<=0){f.aiT=320+Math.random()*280;attack(f,Math.random()<.6?'punch':'kick');}
      else f.state='idle';}
  }else{
    const want=P.x-70;
    if(Math.abs(f.x-want)>26){f.facing=want>f.x?1:-1;f.x+=f.facing*0.11*dt;f.state='walk';f.walk+=dt;}
    else f.state='idle';
  }
}
function goonUpdate(e,dt){
  if(e.down){e.deadT+=dt;return;}
  if(e.hitT>0){e.hitT-=dt;return;}
  const tgt=(!P.down&&(ALLY.down||Math.abs(P.x-e.x)<=Math.abs(ALLY.x-e.x)))?P:(ALLY.down?P:ALLY);
  e.facing=tgt.x>e.x?1:-1;
  const d=Math.abs(tgt.x-e.x);
  if(e.state==='windup'){
    e.stateT+=dt;
    if(e.stateT>=(e.boss?350:420)){
      e.state='strike';e.stateT=0;
      const dodged=(e.atkType==='low'&&(tgt.airY||0)>26)||(e.atkType==='high'&&tgt.state==='crouch');
      if(Math.abs(tgt.x-e.x)<70&&!dodged)hurtDJ(tgt,e.dmg,e);
      else if(Math.abs(tgt.x-e.x)<70&&dodged)pop(tgt.x,FLOOR-SH-24,'DODGED!',WHITE);
    }
  }else if(e.state==='strike'){
    e.stateT+=dt;if(e.stateT>250)e.state='idle';
  }else if(d>56){
    e.x+=e.facing*e.speed*dt*(e.boss?1.2:1);e.state='walk';e.walk+=dt;
  }else{
    e.aiT-=dt;
    if(e.aiT<=0){e.aiT=500+Math.random()*500;e.state='windup';e.stateT=0;e.atkType=Math.random()<0.5?'low':'high';}
    else e.state='idle';
  }
  e.x=Math.max(15,Math.min(LEVELS[G.level].len-15,e.x));
}

/* ================= LEVEL UPDATE ================= */
function jump(){
  if(G.scene!=='play'||P.down||P.airY>0||P.state==='crouch'||P.state==='dance')return;
  P.vy=0.58;sfx.jump();
}
function updateLevel(dt){
  const L=LEVELS[G.level];
  if(P.hitT>0)P.hitT-=dt;
  if(ALLY.hitT>0)ALLY.hitT-=dt;
  if(P.airY>0||P.vy>0){
    P.airY+=P.vy*dt;P.vy-=0.0024*dt;
    if(P.airY<=0){P.airY=0;P.vy=0;}
  }
  if(!P.down){
    if(P.state==='punch'||P.state==='kick')djAttackResolve(P,dt);
    else if(P.state==='special'){P.stateT+=dt;if(P.stateT>500)P.state='idle';}
    else if(P.state==='dance'){P.stateT+=dt;if(P.stateT>DANCE_MS()){P.state='idle';stopHook();}}
    else if(P.state==='crouch'){ if(!keys.crouch)P.state='idle'; }
    else{
      let mv=0;if(keys.left)mv-=1;if(keys.right)mv+=1;
      if(mv!==0){P.facing=mv;P.x+=mv*0.15*dt;P.state='walk';P.walk+=dt;}
      else P.state='idle';
    }
  }
  allyUpdate(ALLY,dt);
  if(G.waveActive){
    P.x=Math.max(G.camX+30,Math.min(G.camX+W-30,P.x));
    ALLY.x=Math.max(G.camX+20,Math.min(G.camX+W-20,ALLY.x));
  }
  P.x=Math.max(30,Math.min(L.len-20,P.x));
  if(!G.waveActive){
    G.camX=Math.max(G.camX,Math.min(P.x-300,L.len-W));
    G.camX=Math.max(0,G.camX);
  }
  if(!G.waveActive&&G.waveIdx<L.waves.length&&P.x>=L.waves[G.waveIdx].x)spawnWave();
  G.enemies.forEach(e=>goonUpdate(e,dt));
  G.enemies=G.enemies.filter(e=>!e.down||e.deadT<900);
  if(G.waveActive&&G.enemies.every(e=>e.down)&&G.enemies.every(e=>e.deadT>300)){
    G.waveActive=false;G.waveIdx++;
    if(ALLY.down){ALLY.down=false;ALLY.hp=50;pop(ALLY.x,FLOOR-SH-20,'BACK UP!',WHITE);}
  }
  G.pickups.forEach(pk=>{
    if(pk.taken)return;
    if(Math.abs(P.x-pk.x)<34){
      pk.taken=true;sfx.pickup();
      const T=PICKUP_TYPES[pk.type];
      if(T.pts)G.score+=T.pts;
      if(T.heal)P.hp=Math.min(100,P.hp+T.heal);
      if(T.meter)P.meter=100;
      pop(pk.x,FLOOR-70,T.label,GOLD);
      spark(pk.x,FLOOR-40,GOLD,10);
    }
  });
  if(P.meter>=100&&!G.readyFlag){G.readyFlag=true;sfx.ready();pop(P.x,FLOOR-SH-30,'SPECIAL READY! HIT S',RED);}
  updateJuice(dt);
  if(!G.waveActive&&G.waveIdx>=L.waves.length&&P.x>=L.len-40){
    addScore(250);
    if(G.level>=LEVELS.length-1){G.scene='win';G.t=0;sfx.win();playHook(true);}
    else{G.level++;startLevel(false);}
  }
}

/* ================= BACKDROPS ================= */
function rep(cam,spacing,fn){
  const start=Math.floor(cam/spacing)*spacing;
  for(let x=start-spacing;x<cam+W+spacing;x+=spacing)fn(x-cam,Math.round(x/spacing));
}
function seedAt(i){return G.seed[((i%60)+60)%60];}
function floorStrip(col,line){
  ctx.fillStyle=col;ctx.fillRect(0,FLOOR,W,H-FLOOR);
  ctx.fillStyle=line||RED;ctx.fillRect(0,FLOOR,W,4);
  ctx.strokeStyle='rgba(255,255,255,0.05)';ctx.lineWidth=2;
  for(let i=1;i<4;i++){ctx.beginPath();ctx.moveTo(0,FLOOR+i*18);ctx.lineTo(W,FLOOR+i*18);ctx.stroke();}
}

  rep(cam*0.6,90,(sx,i)=>{ctx.fillStyle='#1a1826';ctx.fillRect(sx,40,60,80);
    ctx.fillStyle='#221e30';ctx.fillRect(sx+8,48,44,64);});
  rep(cam,400,(sx,i)=>{
    ctx.fillStyle='#08080c';ctx.fillRect(sx+40,250,220,130);
    ctx.fillStyle='#1c1c26';ctx.fillRect(sx+50,200,90,55);

    for(let k=0;k<9;k++){const h=4+Math.abs(Math.sin(t*0.004+k+i))*14;

/* ================= PICKUP DRAW ================= */
function drawPickup(pk,t){
  if(pk.taken)return;
  const sx=pk.x-G.camX;
  if(sx<-40||sx>W+40)return;
  const bob=Math.sin(t*0.005+pk.bobSeed)*5;
  const y=FLOOR-38+bob;
  ctx.fillStyle='rgba(255,210,63,0.12)';ctx.fillRect(sx-18,FLOOR-8,36,6);
  if(pk.type==='headphones'){
    ctx.strokeStyle=GOLD;ctx.lineWidth=4;
    ctx.beginPath();ctx.arc(sx,y,11,Math.PI,0);ctx.stroke();
    ctx.fillStyle=GOLD;ctx.fillRect(sx-15,y-2,7,12);ctx.fillRect(sx+8,y-2,7,12);
  }else if(pk.type==='vinyl'){
    ctx.fillStyle='#111';ctx.beginPath();ctx.arc(sx,y,13,0,7);ctx.fill();
    ctx.strokeStyle='#333';ctx.lineWidth=1;
    ctx.beginPath();ctx.arc(sx,y,9,0,7);ctx.stroke();
    ctx.fillStyle=RED;ctx.beginPath();ctx.arc(sx,y,5,0,7);ctx.fill();
  }else{
    ctx.fillStyle='#1a1a22';ctx.fillRect(sx-16,y-6,32,16);
    ctx.strokeStyle=GOLD;ctx.lineWidth=2;ctx.strokeRect(sx-16,y-6,32,16);
    ctx.fillStyle='#333';ctx.beginPath();ctx.arc(sx-7,y+2,5,0,7);ctx.fill();
    ctx.beginPath();ctx.arc(sx+7,y+2,5,0,7);ctx.fill();
    ctx.fillStyle=RED;ctx.fillRect(sx-2,y-4,4,4);
  }
}

/* ================= DRAW ENTITIES ================= */
function drawShadow(sx,w){
  ctx.fillStyle='rgba(0,0,0,0.45)';
  ctx.beginPath();ctx.ellipse(sx,FLOOR+4,w,5,0,0,7);ctx.fill();
}
function drawDJ(f,t){
  const spr=SPR[f.char];
  const sx=f.x-G.camX;
  const dancing=f.state==='dance';
  const crouching=f.state==='crouch';
  const bob=dancing?Math.abs(Math.sin(t*0.012))*10
    :(f.state==='walk')?Math.sin(f.walk*0.02)*3:Math.sin(t*0.004+f.char)*1.5;
  const squish=crouching?0.6:1;
  const gy=FLOOR-SH*squish+bob-(f.airY||0);
  drawShadow(sx,Math.max(10,24-(f.airY||0)*0.14));
  ctx.save();
  if(f.hitT>0&&Math.floor(f.hitT/40)%2===0)ctx.globalAlpha=0.4;
  if(f.down){
    ctx.translate(sx,FLOOR-10);ctx.rotate(-Math.PI/2);
    ctx.drawImage(spr,-SH,-SW/2);ctx.restore();return;
  }
  ctx.translate(sx,0);ctx.scale(f.facing,1);ctx.translate(-sx,0);
  const wob=dancing?Math.sin(t*0.02)*6:0;
  ctx.save();
  ctx.translate(wob,0);
  ctx.translate(sx,gy);
  ctx.scale(1,squish);
  ctx.drawImage(spr,-SW/2,0);
  ctx.restore();
  const skin=f.char===0?PAL.s:PAL.S;
  if(f.state==='punch'&&f.stateT>MOVES.punch.active-60){
    ctx.fillStyle=skin;ctx.fillRect(sx+SW/2,gy+9*PX,26,8);
    ctx.fillStyle=WHITE;ctx.fillRect(sx+SW/2+26,gy+9*PX-2,10,12);
  }
  if(f.state==='kick'&&f.stateT>MOVES.kick.active-80){
    ctx.fillStyle=f.char===0?PAL.p:PAL.P;ctx.fillRect(sx+SW/2-6,gy+15*PX,34,9);
    ctx.fillStyle=PAL.k;ctx.fillRect(sx+SW/2+28,gy+15*PX-1,12,11);
  }
  ctx.restore();
  if(dancing){
    ctx.fillStyle=GOLD;ctx.font='bold 16px "Courier New"';ctx.textAlign='center';
    const note=String.fromCharCode(9834+((t/200|0)%2));
    ctx.fillText(note,sx+ (Math.sin(t*0.01)*14),gy-14);
    ctx.textAlign='left';
  }
  if(f.state==='special'){
    const pr=f.stateT/500;
    for(let r=0;r<2;r++){
      const rad=pr*180-r*40;if(rad<=0)continue;
      ctx.strokeStyle=r===0?RED:WHITE;ctx.lineWidth=6-r*2;
      ctx.globalAlpha=(1-pr)*(r===0?1:.6);
      ctx.beginPath();ctx.arc(sx,FLOOR-SH/2,rad,0,7);ctx.stroke();
    }
    ctx.globalAlpha=1;
  }
  if(!f.isAlly&&G.scene==='play'){
    ctx.fillStyle=RED;
    ctx.beginPath();ctx.moveTo(sx-6,gy-16);ctx.lineTo(sx+6,gy-16);ctx.lineTo(sx,gy-8);ctx.fill();
  }
}
function drawGoon(e,t){
  const sx=e.x-G.camX;
  if(sx<-80||sx>W+80)return;
  const scale=e.boss?1.4:1;
  const bob=(e.state==='walk')?Math.sin(e.walk*0.02)*3:0;
  drawShadow(sx,e.boss?32:22);
  ctx.save();
  if(e.down){
    ctx.globalAlpha=Math.max(0,1-e.deadT/900);
    ctx.translate(sx,FLOOR-10);ctx.rotate(Math.PI/2);
    ctx.drawImage(sprG,-SH,-SW/2);ctx.restore();return;
  }
  if(e.hitT>0&&Math.floor(e.hitT/40)%2===0)ctx.globalAlpha=0.4;
  ctx.translate(sx,0);ctx.scale(e.facing*scale,scale);ctx.translate(-sx,0);
  const gy=(FLOOR/scale)-SH+bob;
  ctx.drawImage(sprG,sx-SW/2,gy);
  if(e.state==='windup'){ctx.fillStyle=e.atkType==='high'?GOLD:RED;ctx.fillRect(sx-SW/2,gy-10,SW,4);}
  if(e.state==='strike'){ctx.fillStyle='#3a3a46';ctx.fillRect(sx+SW/2,gy+9*PX,24,8);}
  ctx.restore();
  if(e.boss){
    ctx.fillStyle=BLACK;ctx.fillRect(sx-30,FLOOR-SH*1.4-26,60,8);
    ctx.fillStyle=RED;ctx.fillRect(sx-30,FLOOR-SH*1.4-26,60*(e.hp/e.maxhp),8);
  }
}

/* ================= SHARE CARD (Instagram story or square) ================= */
function buildShareCard(square){
  const CW=1080, CH=square?1080:1920;
  const sc=document.createElement('canvas');
  sc.width=CW;sc.height=CH;
  const g=sc.getContext('2d');
  const grad=g.createLinearGradient(0,0,0,CH);
  grad.addColorStop(0,'#1a0406');grad.addColorStop(.55,'#4a0c0e');grad.addColorStop(1,'#0a0a0a');
  g.fillStyle=grad;g.fillRect(0,0,CW,CH);

  // layout anchors scale with canvas height so both formats look intentional
  const top=square?70:130;
  const cubeS=square?9:13;
  g.save();g.translate(CW/2-13*cubeS/2,top);g.scale(cubeS,cubeS);
  CUBE.forEach((row,ry)=>{[...row].forEach((ch,rx)=>{
    if(ch==='r'){g.fillStyle=RED;g.fillRect(rx,ry,1,1);}
    else if(ch==='b'){g.fillStyle='#0a0a0a';g.fillRect(rx,ry,1,1);}
  });});
  g.restore();

  g.textAlign='center';
  const titleY=top+cubeS*14+(square?70:90);
  g.font='bold '+(square?42:56)+'px "Courier New"';
  g.fillStyle=WHITE;g.fillText('ROAD TO',CW/2,titleY);
  g.font='bold '+(square?90:120)+'px "Courier New"';
  g.fillStyle=RED;g.fillText('PARADISE',CW/2,titleY+(square?86:112));
  g.font='bold '+(square?22:30)+'px "Courier New"';
  g.fillStyle=WHITE;g.fillText('JAMES CARTER  X  MARTEN HØRGER',CW/2,titleY+(square?126:160));

  // both DJs, evenly spaced, no overlap
  const heroY=titleY+(square?170:220);
  const s=square?6:7.2;
  const gap=CW*0.22;
  g.save();g.translate(CW/2-gap,heroY);g.scale(s,s);g.drawImage(sprJ,-SW/2,0);g.restore();
  g.save();g.translate(CW/2+gap,heroY);g.scale(-s,s);g.drawImage(sprM,-SW/2,0);g.restore();

  const afterHeroY=heroY+SH*s+(square?60:90);
  g.font='bold '+(square?30:38)+'px "Courier New"';
  g.fillStyle=GOLD;g.fillText(rankFor(G.score),CW/2,afterHeroY);
  g.font='bold '+(square?20:26)+'px "Courier New"';
  g.fillStyle='#ccc';g.fillText('SCORE',CW/2,afterHeroY+(square?46:56));
  g.font='bold '+(square?58:76)+'px "Courier New"';
  g.fillStyle=WHITE;g.fillText(String(G.score).padStart(6,'0'),CW/2,afterHeroY+(square?100:130));

  g.font='bold '+(square?18:22)+'px "Courier New"';
  g.fillStyle=DARKRED;g.fillText('AIH',CW/2,CH-(square?36:60));
  return sc;
}
function shareRun(square){
  const card=buildShareCard(square);

    if(!blob)return;

    if(navigator.canShare&&navigator.canShare({files:[file]})){

}

let last=0,prevScene='title';
function frame(ts){
  const dt=Math.min(40,ts-last);last=ts;G.t+=dt;
  if(prevScene!=='play'&&G.scene==='play')stopHook();
  prevScene=G.scene;
  ctx.save();
  if(G.shake>0){G.shake-=dt*0.03;ctx.translate((Math.random()-0.5)*G.shake,(Math.random()-0.5)*G.shake);}
  ctx.fillStyle=BLACK;ctx.fillRect(-20,-20,W+40,H+40);
  switch(G.scene){
    case 'title':drawTitle(G.t);break;
    case 'select':drawSelect(G.t);break;
    case 'levelIntro':drawLevelIntro(G.t);break;
    case 'play':
      updateLevel(dt);
      BGS[G.level](G.camX,G.t);
      G.pickups.forEach(pk=>drawPickup(pk,G.t));
      G.enemies.forEach(e=>drawGoon(e,G.t));
      drawDJ(ALLY,G.t);drawDJ(P,G.t);
      drawJuice();
      moodOverlay();
      drawHUD();break;
    case 'gameover':drawGameOver(G.t);break;
    case 'win':
      drawWin(G.t);
      if(!G.emailPromptShown&&G.t>2600){G.emailPromptShown=true;showEmailBox();}
      break;
  }
  ctx.restore();
  ctx.drawImage(FX,0,0);
  requestAnimationFrame(frame);
}

document.addEventListener('keydown',e=>{

  if(e.repeat)return;
  const c=e.code;

  if(c==='ArrowRight'||c==='KeyD'){keys.right=true;e.preventDefault();}
  if(c==='ArrowUp'||c==='KeyW'){press('jump',true);e.preventDefault();}
  if(c==='ArrowDown'){press('crouch',true);e.preventDefault();}
  if(c==='KeyZ'||c==='KeyJ'||c==='KeyP'){press('punch',true);e.preventDefault();}

    if(!emailBox.classList.contains('show')&&!shareBox.classList.contains('show'))showShareBox();
  }
}
cv.addEventListener('pointerdown',e=>{const p=canvasPos(e);advance(p.x,p.y);});

function fit(){
  const s=Math.min(innerWidth/W,innerHeight/H);
  cv.style.width=(W*s)+'px';cv.style.height=(H*s)+'px';
}
addEventListener('resize',fit);fit();
})();
</script>
</body>
